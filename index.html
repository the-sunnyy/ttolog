<style>
:root{--bg:#13100E;--panel:#1C1815;--line:#3A332D;--fg:#F5EFE7;--mute:#ADA197;--sand:#F1B66B;--on-sand:#2A1805;--bad:#FF8A7A;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 "Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
form{width:min(360px,100%);display:flex;flex-direction:column;gap:14px}
.wm{font-weight:900;font-size:34px;color:var(--sand);letter-spacing:-.02em}
p{margin:0;color:var(--mute);font-size:14px}
input[type=password]{width:100%;font-size:22px;letter-spacing:.3em;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--fg)}
input[type=password]:focus{outline:2px solid var(--sand);border-color:var(--sand)}
label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute)}
button{background:var(--sand);color:var(--on-sand);border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:700}
button:disabled{opacity:.5}
.err{color:var(--bad);min-height:1.5em}
</style></head><body>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = a => btoa(String.fromCharCode(...new Uint8Array(a)));
async function keyFrom(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function openWith(key) {
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data)));
  document.open(); document.write(html); document.close();
}
function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { } }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
async function start() {
  const saved = load('ttk:key:' + P.id);
  if (saved) {
    try { await openWith(await crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', true, ['decrypt'])); return; }
    catch (e) { store('ttk:key:' + P.id, null); }
  }
  document.getElementById('wait').hidden = true;
  const f = document.getElementById('f'); f.hidden = false; document.getElementById('pw').focus();
  f.addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = document.getElementById('go'), err = document.getElementById('err');
    btn.disabled = true; err.textContent = '';
    try {
      const key = await keyFrom(document.getElementById('pw').value);
      if (document.getElementById('keep').checked) {
        try { await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data)); store('ttk:key:' + P.id, toB64(await crypto.subtle.exportKey('raw', key))); } catch (e) { }
      }
      await openWith(key);
    } catch (e) { err.textContent = '비밀번호가 맞지 않아요.'; btn.disabled = false; }
  });
}
// register the helper first; reload once so the page comes back with the isolation headers
(async () => {
  if ('serviceWorker' in navigator && window.isSecureContext) {
    try {
      await navigator.serviceWorker.register('./sw.js');
      if (!window.crossOriginIsolated && !sessionStorage.getItem('ttk-coi')) {
        const again = () => { sessionStorage.setItem('ttk-coi', '1'); location.reload(); };
        if (navigator.serviceWorker.controller) { again(); return; }
        const t = setTimeout(start, 4000);
        navigator.serviceWorker.addEventListener('controllerchange', () => { clearTimeout(t); again(); });
        return;
      }
    } catch (e) { }
  }
  start();
})();
